# Configuracao do sonar-scanner (usada por "ci.bat sonar"). O servidor e o token vem do ambiente
# (SONAR_HOST_URL / SONAR_TOKEN), nunca deste ficheiro.
sonar.projectKey=CodeManager
sonar.projectName=CodeManager
sonar.projectBaseDir=.
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/Tests.*.pas
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/*.dcu,**/*.res,**/*.exe,bin/**,obj/**,tests/bin/**,tests/obj/**
# num .properties a barra invertida e escape: usa sempre '/' nos caminhos do Windows
sonar.delphi.installationPath=C:/Program Files (x86)/Embarcadero/Studio/37.0
sonar.delphi.compilerVersion=VER370